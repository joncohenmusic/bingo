<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo Overlay (v1.1)</title>
<!-- OBS BROWSER SOURCE: 600 x 920 · enable "Page has transparent background" -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:600px;height:920px;background:transparent;overflow:hidden;font-family:"Lexend",sans-serif;}
#overlay{
  width:584px;margin:8px;
  background:linear-gradient(160deg,#0a0a1e 0%,#0d0d28 100%);
  border:2px solid rgba(255,45,85,.35);
  border-radius:22px;
  padding:18px 18px 20px;
  box-shadow:0 0 40px rgba(255,45,85,.15),0 0 80px rgba(0,212,255,.08),inset 0 0 40px rgba(0,0,0,.4);
  opacity:0;
  transform:scale(0.97);
  transition:opacity 0.5s ease,transform 0.5s ease;
  pointer-events:none;
}
#overlay.visible{opacity:1;transform:scale(1);}
.title{
  font-family:"Bangers",cursive;
  font-size:72px;line-height:.92;letter-spacing:6px;text-transform:uppercase;text-align:center;
  background:linear-gradient(135deg,#ff2d55,#00d4ff,#bf5fff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(255,45,85,.4)) drop-shadow(0 0 40px rgba(0,212,255,.2));
  animation:titlePulse 3s ease-in-out infinite;
}
@keyframes titlePulse{
  0%,100%{filter:drop-shadow(0 0 20px rgba(255,45,85,.4)) drop-shadow(0 0 40px rgba(0,212,255,.2));}
  50%{filter:drop-shadow(0 0 30px rgba(255,45,85,.6)) drop-shadow(0 0 60px rgba(0,212,255,.4));}
}
.subtitle{font-size:11px;color:rgba(170,170,200,.65);letter-spacing:4px;text-transform:uppercase;text-align:center;margin-top:5px;}
.score-bar{display:flex;gap:28px;justify-content:center;margin:10px 0 14px;font-size:14px;color:rgba(170,170,200,.7);font-weight:600;}
.score-bar .val{color:#00d4ff;font-family:"Bangers",cursive;font-size:20px;letter-spacing:2px;}
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:12px;
  background:linear-gradient(135deg,rgba(255,45,85,.07),rgba(0,212,255,.07));
  border:1px solid rgba(255,45,85,.25);border-radius:14px;
}
.cell{
  aspect-ratio:4/3;background:#1a1a3e;border:1px solid rgba(255,255,255,.06);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:7px 6px;position:relative;overflow:hidden;
}
.cell-text{font-size:clamp(9px,2.3vw,15px);font-weight:600;line-height:1.2;color:#f0f0ff;overflow-wrap:anywhere;hyphens:auto;}
.cell-caller{font-size:clamp(9px,1.9vw,12px);color:#ffe600;margin-top:3px;font-weight:700;overflow-wrap:anywhere;}
.cell.marked{
  background:linear-gradient(135deg,#ff2d55,#cc1144);border-color:#ff2d55;
  box-shadow:0 0 16px rgba(255,45,85,.4),inset 0 0 12px rgba(255,255,255,.08);
}
.cell.marked .cell-text{color:#fff;}
.cell.marked::after{content:"✓";position:absolute;top:4px;right:6px;font-size:12px;opacity:.7;}
.cell.pending{border-color:rgba(255,230,0,.7);animation:pendingPulse 1.5s ease-in-out infinite;}
@keyframes pendingPulse{
  0%,100%{box-shadow:0 0 6px rgba(255,230,0,.2);border-color:rgba(255,230,0,.5);}
  50%{box-shadow:0 0 18px rgba(255,230,0,.5);border-color:rgba(255,230,0,.9);}
}
.cell.free-space{background:linear-gradient(135deg,#2a1a0a,#3d1a00);border-color:rgba(255,100,0,.4);}
.cell.free-space .cell-text{font-family:"Bangers",cursive;font-size:clamp(11px,2.6vw,18px);letter-spacing:1px;color:#ff6600;text-shadow:0 0 8px rgba(255,100,0,.5);}
.cell.win-highlight{animation:winPulse .6s ease infinite alternate;border-color:#ffd700!important;}
@keyframes winPulse{
  from{box-shadow:0 0 20px rgba(255,215,0,.5),0 0 40px rgba(255,215,0,.2);}
  to{box-shadow:0 0 32px rgba(255,215,0,.8),0 0 60px rgba(255,215,0,.4);}
}
.waiting{grid-column:1/-1;color:rgba(170,170,200,.5);text-align:center;padding:40px;font-size:13px;}
/* ---- Winners reveal ---- */
#overlay.mode-winners{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)!important;margin:0;}
#winners{display:none;position:relative;flex-direction:column;align-items:center;text-align:center;padding:14px 6px 18px;}
#overlay.mode-winners .title,#overlay.mode-winners .subtitle,#overlay.mode-winners .score-bar,#overlay.mode-winners .grid{display:none;}
#overlay.mode-winners #winners{display:flex;}
.w-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.w-piece{position:absolute;top:-10%;width:10px;height:14px;opacity:0;}
#winners.reveal .w-piece{animation:wfall linear forwards;}
@keyframes wfall{0%{opacity:0;transform:translateY(-10%) rotate(0);}8%{opacity:1;}100%{opacity:.9;transform:translateY(920px) rotate(720deg);}}
.w-trophy{font-size:84px;line-height:1;filter:drop-shadow(0 6px 18px rgba(255,215,0,.5));opacity:0;transform:translateY(-30px) scale(.5);}
#winners.reveal .w-trophy{animation:wdrop .8s cubic-bezier(.2,1.4,.3,1) .1s forwards;}
@keyframes wdrop{60%{opacity:1;}to{opacity:1;transform:none;}}
.w-kicker{font-family:"Bangers",cursive;letter-spacing:6px;font-size:26px;color:#ffd700;margin-top:6px;opacity:0;}
#winners.reveal .w-kicker{animation:wrise .5s ease .45s forwards;}
.w-name{font-family:"Bangers",cursive;letter-spacing:2px;font-size:60px;line-height:.95;
  background:linear-gradient(180deg,#fff8e8,#ffd700 55%,#b8860b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 16px rgba(255,215,0,.4));word-break:break-word;opacity:0;transform:scale(1.2);margin:2px 0;}
#winners.reveal .w-name{animation:wslam .5s cubic-bezier(.2,.9,.2,1) .6s forwards;}
.w-name.tie{font-size:38px;}
@keyframes wslam{0%{opacity:0;transform:scale(1.2);}60%{opacity:1;}to{opacity:1;transform:scale(1);}}
.w-tally{font-size:18px;color:#f0f0ff;font-weight:700;margin-top:4px;opacity:0;}
.w-tally b{color:#ffd700;}
#winners.reveal .w-tally{animation:wrise .5s ease .9s forwards;}
.w-board{width:92%;margin:16px auto 0;display:flex;flex-direction:column;gap:6px;opacity:0;}
#winners.reveal .w-board{animation:wrise .5s ease 1.1s forwards;}
.w-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,215,0,.14);color:#f0f0ff;font-weight:700;font-size:16px;}
.w-row.top{background:linear-gradient(90deg,rgba(255,215,0,.2),rgba(255,215,0,.04));border-color:rgba(255,215,0,.5);}
.w-rank{width:2ch;text-align:center;color:#ffd700;font-family:"Bangers",cursive;font-size:20px;flex-shrink:0;}
.w-who{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.w-pts{color:#ffd700;font-variant-numeric:tabular-nums;flex-shrink:0;}
@keyframes wrise{to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div id="overlay">
  <div class="title">BELIEVER<br>BINGO</div>
  <div class="subtitle">The Unconvinced Livestream</div>
  <div class="score-bar">
    <span>Squares: <span class="val" id="markedVal">0</span> / <span class="val" id="totalVal">0</span></span>
    <span>Lines: <span class="val" id="linesVal">0</span></span>
  </div>
  <div class="grid" id="grid">
    <div class="waiting">Waiting for game to start...</div>
  </div>
  <div id="winners">
    <div class="w-confetti" id="wConfetti"></div>
    <div class="w-trophy">🏆</div>
    <div class="w-kicker" id="wKicker">BINGO CHAMPION</div>
    <div class="w-name" id="wName">—</div>
    <div class="w-tally" id="wTally"></div>
    <div class="w-board" id="wBoard"></div>
    <audio id="wSound" preload="auto"></audio>
  </div>
</div>

}

  }
  return lines;
}

function playWinnerSound(){
  const el=document.getElementById("wSound");
  if(!el){ winnersFanfare(true); return; }
  try{
    el.src = WINNER_SOUND || EMBEDDED_WINNER_SOUND;
    el.volume = 0.7; el.currentTime = 0;
    const pr = el.play();
    if(pr && pr.catch) pr.catch(function(){ winnersFanfare(true); });
  }catch(e){ winnersFanfare(true); }
}

function computeWinners(){
  const counts={}, display={};
  for (const k in markedCells){
    let u=getMarkedUser(markedCells[k]); if(!u) continue;
    u=String(u).trim().replace(/^@+/,""); if(!u) continue;
    const key=u.toLowerCase(); counts[key]=(counts[key]||0)+1;
    if(!display[key]) display[key]=u;
  }
  const rows=Object.keys(counts).map(function(k){return {user:display[k],count:counts[k]};})
    .sort(function(a,b){return b.count-a.count||a.user.localeCompare(b.user);});
  const top=rows.length?rows[0].count:0;
  return {rows:rows,winners:rows.filter(function(r){return r.count===top&&top>0;}).map(function(r){return r.user;}),top:top};
}

function winnersConfetti(){
  const wrap=document.getElementById("wConfetti"); if(!wrap) return;
  wrap.innerHTML="";
  const colors=["#ffd700","#fff7e6","#ff2d55","#00d4ff","#bf5fff"];
  for(let i=0;i<80;i++){
    const pc=document.createElement("div"); pc.className="w-piece";
    pc.style.left=Math.random()*100+"%";
    pc.style.background=colors[i%colors.length];
    pc.style.animationDuration=(2.4+Math.random()*2.2)+"s";
    pc.style.animationDelay=(Math.random()*0.7)+"s";
    if(Math.random()<0.5) pc.style.borderRadius="50%";
    wrap.appendChild(pc);
  }
}

function winnersFanfare(win){
  try{
    wAudioCtx = wAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(wAudioCtx.state==="suspended") wAudioCtx.resume();
    const now=wAudioCtx.currentTime;
    const notes = win ? [523.25,659.25,783.99,1046.50] : [392.00,329.63];
    notes.forEach(function(f,i){
      const o=wAudioCtx.createOscillator(), g=wAudioCtx.createGain();
      o.type="triangle"; o.frequency.value=f; const t=now+i*0.13;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
      o.connect(g).connect(wAudioCtx.destination); o.start(t); o.stop(t+0.45);
    });
  }catch(e){}
}

function renderWinners(animate){
  const r=computeWinners();
  const nameEl=document.getElementById("wName"), tallyEl=document.getElementById("wTally"),
        boardEl=document.getElementById("wBoard"), kickerEl=document.getElementById("wKicker");
  if(!r.rows.length){
    kickerEl.textContent="BINGO";
    nameEl.classList.remove("tie"); nameEl.textContent="No calls yet";
    tallyEl.innerHTML="No squares were approved on the board.";
    boardEl.innerHTML="";
  } else {
    const tie=r.winners.length>1;
    kickerEl.textContent=tie?"BINGO CHAMPIONS":"BINGO CHAMPION";
    nameEl.classList.toggle("tie",tie);
    nameEl.innerHTML=tie?r.winners.map(esc).join(" · "):esc(r.winners[0]);
    tallyEl.innerHTML=tie
      ? ("tied on <b>"+r.top+"</b> "+(r.top===1?"call":"calls")+" each")
      : ("<b>"+r.top+"</b> "+(r.top===1?"call":"calls")+" on the board");
    boardEl.innerHTML=r.rows.slice(0,5).map(function(row,i){
      return '<div class="w-row '+(row.count===r.top?"top":"")+'">'
        +'<span class="w-rank">'+(i+1)+'</span>'
        +'<span class="w-who">'+(i===0?"👑 ":"")+esc(row.user)+'</span>'
        +'<span class="w-pts">'+row.count+'</span></div>';
    }).join("");
  }
  if(animate){
    const w=document.getElementById("winners");
    w.classList.remove("reveal"); void w.offsetWidth; w.classList.add("reveal");
    winnersConfetti();
    if (r.rows.length) playWinnerSound(); else winnersFanfare(false);
  }
}

function buildGrid() {
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  if (!boardSquares.length) {
    grid.style.gridTemplateColumns="repeat(3,1fr)";
    grid.style.gridTemplateRows="";
    grid.innerHTML='<div class="waiting">Waiting for game to start...</div>';
    document.getElementById("markedVal").textContent="0";
    document.getElementById("totalVal").textContent="0";
    document.getElementById("linesVal").textContent="0";
    return;
  }
  const cols=boardCols, rows=boardRows, FREE=boardFreeIdx;
  const TOTAL=cols*rows;
  const WIN=computeWinLines(cols, rows, FREE);
  grid.style.gridTemplateColumns="repeat("+cols+",1fr)";
  grid.style.gridTemplateRows="repeat("+rows+",1fr)";
  detectedLines.clear();
  WIN.forEach(function(line,idx){
    if (line.every(function(i){return i===FREE||getMarkedUser(markedCells[String(i)]);})) detectedLines.add(String(idx));
  });
  for (let i=0;i<TOTAL;i++){
    const cell=document.createElement("div"); cell.className="cell";
    const isFree=(i===FREE),markedEntry=markedCells[String(i)],isPend=pendingMap[i]!==undefined;
    const mUser=getMarkedUser(markedEntry);
    const text=isFree?"🔥 CRASH OUT 🔥":(boardSquares[i>FREE?i-1:i]||"?");
    if (isFree) cell.classList.add("free-space");
    if (mUser){
      cell.classList.add("marked");
      const mCaller=getMarkedCaller(markedEntry);
      let inner='<span class="cell-text">'+esc(text)+'</span><span class="cell-caller">@'+esc(mUser.replace(/^@/,""))+'</span>';
      if (mCaller){
        inner += '<span class="cell-caller" style="font-size:10px;opacity:.75;font-weight:600;margin-top:1px;letter-spacing:.3px;">🎙 '+esc(mCaller)+'</span>';
      }
      cell.innerHTML=inner;
    } else if (isPend){
      cell.classList.add("pending");
      cell.innerHTML='<span class="cell-text">'+esc(text)+'</span><span class="cell-caller" style="color:rgba(255,230,0,.7)">⏳ pending</span>';
    } else {
      cell.innerHTML='<span class="cell-text">'+esc(text)+'</span>';
    }
    detectedLines.forEach(function(k){ if(WIN[+k]&&WIN[+k].includes(i)) cell.classList.add("win-highlight"); });
    grid.appendChild(cell);
  }
  document.getElementById("markedVal").textContent=Object.keys(markedCells).length;
  document.getElementById("totalVal").textContent=TOTAL;
  document.getElementById("linesVal").textContent=detectedLines.size;
  requestAnimationFrame(fitCellText);
}

// Auto-shrink each cell's text (and caller lines if needed) so nothing clips on a 5x5 board
function fitCellText(){
  document.querySelectorAll(".cell").forEach(function(cell){
    const txt=cell.querySelector(".cell-text"); if(!txt) return;
    const extras=cell.querySelectorAll(".cell-caller,.cell-pend-label,.cell-pending-label");
    txt.style.fontSize=""; extras.forEach(function(e){e.style.fontSize="";});
    const cs=getComputedStyle(cell);
    const availH=cell.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    const availW=cell.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    if(!(availH>0)||!(availW>0)) return;
    function contentH(){let h=0;cell.querySelectorAll(":scope > *").forEach(function(el){h+=el.getBoundingClientRect().height;});return h;}
    function tooWide(el){return el.scrollWidth>Math.ceil(availW)+1;}
    // Shrink the square text until it fits both vertically and horizontally
    let size=parseFloat(getComputedStyle(txt).fontSize),guard=90;
    while(guard-->0 && size>6 && (contentH()>availH || tooWide(txt))){size-=0.5;txt.style.fontSize=size+"px";}
    // Then shrink caller/pending lines if they still push it over
    guard=60;
    while(guard-->0 && extras.length){
      let over=contentH()>availH;
      extras.forEach(function(e){ if(tooWide(e)) over=true; });
      if(!over) break;
      let shrunk=false;
      extras.forEach(function(e){let v=parseFloat(getComputedStyle(e).fontSize);if(v>6){e.style.fontSize=(v-0.5)+"px";shrunk=true;}});
      if(!shrunk) break;
    }
  });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ requestAnimationFrame(fitCellText); });

onSnapshot(doc(db,"games","current"),function(snap){
  if (!snap.exists()){boardSquares=[];markedCells={};buildGrid();return;}
  const data=snap.data();
  boardSquares=data.squares||[];
  markedCells=data.markedCells||{};
  // Shape: prefer explicit doc fields, else infer from square count
  if (data.cols && data.rows) {
    boardCols=data.cols; boardRows=data.rows;
  } else {
    const total=boardSquares.length+1;
    if (total===9)       { boardCols=3; boardRows=3; }
    else if (total===12) { boardCols=3; boardRows=4; }
    else                 { boardCols=3; boardRows=Math.ceil(total/3); }
  }
  boardFreeIdx=(typeof data.freeIndex==="number") ? data.freeIndex : defaultFreeIndex(boardCols, boardRows);
  const showWin = data.showWinners || false;
  const overlayEl = document.getElementById("overlay");
  overlayEl.classList.toggle("visible",(data.overlayVisible||false) || showWin);
  if (showWin) {
    if (!winnersActive) { winnersActive=true; overlayEl.classList.add("mode-winners"); renderWinners(true); }
    else { renderWinners(false); }
  } else if (winnersActive) {
    winnersActive=false; overlayEl.classList.remove("mode-winners");
  }
  buildGrid();
});

onSnapshot(collection(db,"games","current","pending"),function(snap){
  pendingMap={};
  snap.forEach(function(d){pendingMap[d.data().cellIndex]=d.id;});
  buildGrid();
});
</script>
